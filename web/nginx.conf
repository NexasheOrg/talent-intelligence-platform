server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The assistant is a separate service, so its routes are forwarded first.
  # nginx matches the longest prefix, so this wins over the /api/ block below.
  location /api/assistant/ {
    proxy_pass http://assistant:8100;
  }

  # Everything else under /api/ goes to the main API.
  location /api/ {
    proxy_pass http://api:8000;
  }

  # The dashboard uses real URLs (/consultants, /funnel). Those paths don't exist as files,
  # so anything unmatched falls back to index.html and React Router takes it from there.
  # Without this, refreshing on /consultants would 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
