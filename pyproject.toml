# Shared Python tooling config for the repo's Python layers.
# Each service may add its own dependency manifest; this file holds lint/test config.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's defaults. Defaults change between ruff
# releases, and since CI installs the latest, an unpinned set means someone's unrelated PR
# goes red because a new rule shipped that morning. Lint should only fail for reasons we chose.
#
#   E, F  pycodestyle + pyflakes: real errors and unused/undefined names
#   I     import order, so imports stop appearing in diffs as noise
#   UP    modern syntax for our target Python
#   B     bugbear: mutable default arguments and similar real traps
#   SIM   simplifications that genuinely read better
#
# Adding a rule family is fine - do it in its own PR that also fixes the fallout, so nobody
# else's branch turns red without warning.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
# `tests/` is the repo-wide suite; each service keeps its own tests next to its code.
testpaths = ["tests", "api/tests", "data-platform/tests", "ai-assistant/tests"]
# So `from app.main import app` and `from assistant...` resolve without installing anything.
pythonpath = ["api", "ai-assistant"]
addopts = "-q"
