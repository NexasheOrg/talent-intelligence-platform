# Shared Python tooling config for the repo's Python layers.
# Each service may add its own dependency manifest; this file holds lint/test config.

[tool.ruff]
line-length = 100
target-version = "py311"
# Uses ruff's default lint rules (pyflakes + a pycodestyle subset). Kept intentionally
# conservative so CI is about real problems, not style bikeshedding.

[tool.pytest.ini_options]
# `tests/` is the repo-wide suite; each service keeps its own tests next to its code.
testpaths = ["tests", "api/tests", "data-platform/tests", "ai-assistant/tests"]
# So `from app.main import app` and `from assistant...` resolve without installing anything.
pythonpath = ["api", "ai-assistant"]
addopts = "-q"
